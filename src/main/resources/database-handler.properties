# Defaults contributed by database-handler via @PropertySource on
# DatabaseHandlerAutoConfiguration. These have the lowest precedence, so a
# consuming application can override any single key without replacing the rest.

# Datasource, built from the deployment's environment variables
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT:5432}/${POSTGRES_DB}?sslmode=${POSTGRES_SSLMODE:prefer}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

# jOOQ: PostgreSQL only
spring.jooq.sql-dialect=POSTGRES

# Flyway: run consumer migrations from classpath:db/migration on startup.
# Baseline-on-migrate stays off so a non-empty schema without a Flyway history
# table fails fast instead of silently skipping V1.
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
# Keep Flyway's history table in public. Otherwise Flyway uses the first
# existing schema in Postgres' search_path ("$user", public), so once a
# migration creates a schema named after the database user, the next start
# looks for the history there, finds a non-empty schema and fails.
spring.flyway.default-schema=public

# Table initialiser: creates the tables described by JSON files in
# classpath*:definitions/tables/**/*.json on startup, if they don't exist.
# Set to false to switch it off.
database-handler.tables.enabled=true
